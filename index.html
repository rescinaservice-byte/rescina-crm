<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM Rescina Service</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef2f7;--card:#fff;--tx:#16202c;--mu:#667588;--bd:#e1e7ef;--ac:#0f766e;--acx:#fff;--wa:#d97706;--er:#dc2626;--bl:#2563eb;--gr:linear-gradient(135deg,#0058a9,#1d78d6)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1620;--card:#182230;--tx:#e8eef6;--mu:#93a3b8;--bd:#263447;--ac:#2dd4bf;--acx:#06201d;--wa:#fbbf24;--er:#f87171;--bl:#60a5fa}}
:root[data-theme="dark"]{--bg:#0f1620;--card:#182230;--tx:#e8eef6;--mu:#93a3b8;--bd:#263447;--ac:#2dd4bf;--acx:#06201d;--wa:#fbbf24;--er:#f87171;--bl:#60a5fa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;padding:14px 16px;border-radius:14px;background:#0058a9;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25)}
h1{font-size:18px;margin:0}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.22);color:#fff}
header .btn{background:rgba(255,255,255,.2);color:#fff;border:0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:3px}
button,input,select,textarea{font:inherit;color:inherit}
.tab{padding:8px 14px;border:0;background:var(--card);border-radius:99px;white-space:nowrap;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tab.on{background:var(--gr);color:#fff;font-weight:600}
.btn{padding:8px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
.btn.p{background:var(--gr);color:#fff;border:0;font-weight:600;box-shadow:0 3px 10px rgba(37,99,235,.25)}
.btn.s{padding:6px 11px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--bd);border-radius:12px;padding:13px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.k_nuova{border-left-color:var(--er)}.k_lavorazione{border-left-color:var(--bl)}.k_conclusa{border-left-color:var(--ac)}
.k_urg{border-left-color:var(--er);background:linear-gradient(90deg,rgba(220,38,38,.12),transparent 65%),var(--card)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mu{color:var(--mu);font-size:13px}
.st{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;color:#fff;white-space:nowrap}
.st.nuova{background:var(--er);color:#fff}.st.lavorazione{background:var(--bl);color:#fff}.st.conclusa{background:var(--ac);color:var(--acx)}
.st.u_massima{background:var(--er);color:#fff}.st.u_media{background:rgba(217,119,6,.16);color:var(--wa)}.st.u_minima{background:var(--bd);color:var(--mu)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.unp{color:var(--er);font-weight:700}
.btn.d{background:var(--er);color:#fff;border-color:var(--er)}
.fold{display:block;width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit;border-left-color:var(--ac)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;max-width:90vw}
.alert{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));background:var(--er);color:#fff;padding:12px 14px;border-radius:10px;z-index:100;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.3);cursor:pointer}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(94vw,460px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:13px;color:var(--mu);margin-top:8px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
input[type=checkbox]{width:auto}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.hl{display:flex;align-items:center;gap:10px}.logo{height:46px;width:auto;border-radius:6px}
header h1{color:#ffd400;font-size:17px;letter-spacing:.5px}
.badge{background:#ffd400;color:#0b3a73;font-weight:600}
.foot{text-align:center;margin:22px 0 8px;color:var(--mu);font-size:12px}.foot img{height:22px;vertical-align:middle;margin-right:6px;border-radius:4px}
.lg-c{height:56px;display:block;margin:0 auto 10px;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.chip{display:inline-flex;align-items:center;gap:6px;margin:0;padding:6px 10px;border:1px solid var(--bd);border-radius:99px;background:var(--bg);color:var(--tx);font-size:13px}
#f_urg{border:2px solid var(--er);background:rgba(220,38,38,.1);color:var(--er);font-weight:700}
.nov{background:var(--er);color:#fff;border-radius:99px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap}
</style></head><body><main>
<header><div class="hl"><img class="lg logo" alt="Rescina Service"><h1>CRM</h1></div><div><button class="btn s" id="out">Esci</button> <span class="badge" id="who"></span></div></header>
<div id="app"><div class="empty">Caricamento…</div></div>
<div class="foot"><img class="lg" alt="">Rescina Service · Noicattaro</div>
<dialog id="dlg"></dialog>
</main>

  else if(a==='appr')await updateDoc(doc(fs,'utenti',id),{ok:true});
  else if(a==='rej')await deleteDoc(doc(fs,'utenti',id));
  else if(a==='alt')setAlt(id);
  else if(a==='open'){S.folder=id||null;render()}
  else if(a==='opent'){S.tf=id||null;render()}
  else if(a==='adm')openAdm();
  else if(a==='admok')adminLogin();
  else if(a==='fclr'){S.d1='';S.d2='';S.dk='dLavoro';render()}
  else if(a==='exp')exportCsv(id==='tf'?tfList():visAll());
  else if(a==='rest')await db.collection('schede').doc(id).update({eliminata:false,storico:hist(id,'Ripristinata')});
  else if(a==='edit')openForm(get(id));
  else if(a==='save'){
    const d={cliente:v('f_cliente'),tel:v('f_tel'),email:v('f_email'),indirizzo:v('f_ind'),...getLav(),dLavoro:v('f_dl'),collab:v('f_collab'),urg:v('f_urg'),contatto:(v('f_cont')==='Altro'?'Altro'+(v('f_cont2')?': '+v('f_cont2'):''):v('f_cont')),nota:v('f_nota')};Object.assign(d,closeFields());
    if(!d.cliente||!d.lavoro||(!id&&!d.collab)){toast('Cliente, lavoro e collaboratore sono obbligatori');return}
    if(id)await db.collection('schede').doc(id).update({...d,storico:hist(id,'Modificata')});
    else{const t=now();const tg=d.collab==='*'?S.collabs.map(c=>c.id):[d.collab];if(!tg.length){toast('Nessun collaboratore: aggiungine uno');return}for(const c of tg)await db.collection('schede').add({...d,collab:c,stato:'nuova',creata:t,creatoDa:S.me,pagato:false,storico:[{ev:'Creata',ts:t,by:myId()}]});if(tg.length>1)toast('Create '+tg.length+' schede, una per collaboratore')}
    $('#dlg').close();
    if(d.collab!=='*'&&d.collab!==myId())toast('Scheda assegnata a '+nm(d.collab));
  }
  else if(a==='work')await db.collection('schede').doc(id).update({stato:'lavorazione',dLavorazione:now(),storico:hist(id,'Messa in lavorazione')});
  else if(a==='close')openClose(get(id));
  else if(a==='doclose'){
    const pos=v('c_esito')==='positivo';
    await db.collection('schede').doc(id).update({stato:'conclusa',dConclusione:now(),storico:hist(id,'Conclusa – esito '+v('c_esito')),esito:v('c_esito'),prezzo:v('c_prezzo'),pagamento:v('c_pag'),pagato:pos?$('#c_pagato').checked:true,nota:v('c_nota')});
    $('#dlg').close();
  }
  else if(a==='paid')await db.collection('schede').doc(id).update({pagato:true,dPagamento:now(),storico:hist(id,'Pagamento ricevuto')});
  else if(a==='del'){if(isUnp(get(id))){toast('Scheda non pagata: non si può eliminare');return}openDel(id)}
  else if(a==='delok'){if(isUnp(get(id))){toast('Scheda non pagata: non si può eliminare');return}if(v('d_pw')!=='555'){toast('Password errata');return}const sc=get(id);if(sc&&sc.eliminata)await db.collection('schede').doc(id).delete();else await db.collection('schede').doc(id).update({eliminata:true,dEliminata:now(),storico:hist(id,'Eliminata dalla cartella del collaboratore')});$('#dlg').close();toast(sc&&sc.eliminata?'Scheda eliminata definitivamente':'Tolta dalla cartella, resta in Per tipo')}
  else if(a==='addc'){const n=v('nn');if(!n)return;await db.collection('collab').add({nome:n,uid:''})}
  else if(a==='claim'){await db.collection('collab').doc(id).update({uid:S.me})}
  else if(a==='unlink'){await db.collection('collab').doc(id).update({uid:''})}
  else if(a==='rmc'){if(!cf(a,id)){pend=a+id;render();return}pend='';await db.collection('collab').doc(id).delete();toast('Collaboratore rimosso')}
  }catch(err){toast('Operazione non riuscita: '+(err.message||err.code||err))}
});
const NOCFG=firebaseConfig.apiKey==="INCOLLA";
let unsubs=[];
try{let d=localStorage.getItem('did');if(!d){d=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('did',d)}S.me=d;S.admin=localStorage.getItem('adm')==='1'}catch(e){S.me='tmp'+Math.random().toString(36).slice(2)}
const pe=e=>{$('#app').innerHTML='<div class="empty">Errore: '+esc(e.code||e.message)+'<br>Controlla le regole di Firestore.</div>'};
function openAdm(){$('#dlg').innerHTML='<h3 style="margin:0">Accesso amministratore</h3><label>Codice</label><input id="a_pw" type="password" autocomplete="off"><div class="acts" style="margin-top:14px"><button class="btn p" data-act="admok">Entra</button><button class="btn" data-act="x">Annulla</button></div>';$('#dlg').showModal()}
function adminLogin(){if(v('a_pw')!==ADMIN_CODE){toast('Codice errato');return}try{localStorage.setItem('adm','1')}catch(e){}S.admin=true;$('#dlg').close();render()}
function start(){
  unsubs.push(onSnapshot(collection(fs,'collab'),sn=>{S.collabs=sn.docs.map(d=>({id:d.id,...d.data()}));render()},pe));
  unsubs.push(onSnapshot(collection(fs,'schede'),sn=>{S.schede=sn.docs.map(d=>({id:d.id,...d.data()}));checkUrgent();render()},pe));
  render();
}
if(NOCFG){
  $('#app').innerHTML='<div class="card"><b>Configurazione mancante</b><p class="mu">Apri il file e inserisci i dati di Firebase nella parte "DA COMPILARE".</p></div>';
}else{
  const app=initializeApp(firebaseConfig);fs=getFirestore(app);
  db={collection:n=>({add:d=>addDoc(collection(fs,n),d),doc:id=>({update:d=>updateDoc(doc(fs,n,id),d),set:d=>setDoc(doc(fs,n,id),d),delete:()=>deleteDoc(doc(fs,n,id))})})};
  $('#out').onclick=async()=>{try{localStorage.removeItem('adm');localStorage.removeItem('gate')}catch(e){}gateOK=false;S.admin=false;const c=myC();if(c){try{await db.collection('collab').doc(c.id).update({uid:''})}catch(e){}}render()};
  start();
}
</script></body></html>
